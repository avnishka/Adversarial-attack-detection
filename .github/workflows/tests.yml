# Runs the unit tests on every pull request and on every push to main.
# The model-based integration test is skipped here (no PyTorch/weights in CI).
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy opencv-python-headless scipy pyyaml pytest pandas scikit-learn matplotlib
      - run: pytest -q
